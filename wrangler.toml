name = "tg-agent"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Premenné nastavené v dashboarde sa pri deployi nebudú mazať
keep_vars = true

# Logy vo Workers Logs (dashboard -> Worker -> Logs)
[observability]
enabled = true

# Cron: každú minútu
[triggers]
crons = ["* * * * *"]

# KV storage pre úlohy a históriu konverzácie (binding musí mať názov KV, ako v kóde: env.KV)
[[kv_namespaces]]
binding = "KV"
id = "b9e80524875c44679850a463eee3626e"

# D1 s letákmi sa nečíta cez binding (ID databázy by bolo v repozitári), ale cez REST API.
# Nastav Secrets: CF_ACCOUNT_ID, CF_D1_DATABASE_ID, CF_API_TOKEN (src/d1rest.js).

# TAJNÉ HODNOTY SEM NEDÁVAJ. Nastav ich ako Secrets (Settings -> Variables and Secrets -> Secret):
#   SECRET, TG_TOKEN, GEMINI_KEY, OWNER_ID
# alebo cez: npx wrangler secret put GEMINI_KEY
